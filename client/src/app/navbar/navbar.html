<mat-toolbar>

    <span class="logo">TaskFlow</span>

    <span class="spacer"></span>

    @if (!authService.loggedIn()) {

        <a
            mat-button
            routerLink="/login"
            routerLinkActive="active"
        >
            Login
        </a>

    }
    @else {

        <a
            mat-button
            routerLink="/dashboard"
            routerLinkActive="active"
        >
            Dashboard
        </a>

        <button
            mat-button
            type="button"
            (click)="logout()"
        >
            Logout
        </button>

    }

</mat-toolbar>
