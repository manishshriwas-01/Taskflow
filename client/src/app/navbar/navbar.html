<!-- //material ui -->
<mat-toolbar>
    <span class="logo">TaskFlow</span>
    <span class="spacer"></span>

    <a mat-button routerLink="/dashboard" routerLinkActive="active">Dashboard
    </a>

    @if(!authService.loggedIn()){
        <a mat-button routerLink="/login" routerLinkActive="active">Login</a>
    }
    @else{
        <button mat-button type="button" (click)="logout()">Logout</button>
    }

</mat-toolbar>
