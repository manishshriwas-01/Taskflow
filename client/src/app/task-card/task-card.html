<mat-card class="task-card">

  <mat-card-header>

    <mat-card-title>
      {{ task.title }}
    </mat-card-title>

    <mat-card-subtitle>
      {{ task.status }}
    </mat-card-subtitle>

  </mat-card-header>


  <mat-card-content>

    <p class="description">
      {{ task.description }}
    </p>

    <div class="details">

      <p>
        <strong>Priority:</strong>
        {{ task.priority }}
      </p>

      <p>
        <strong>Due Date:</strong>
        {{ task.dueDate | dueSoon }}
      </p>

    </div>

  </mat-card-content>


  <mat-card-actions>

    <button
      mat-raised-button
      type="button"
      class="edit-btn"
      (click)="edit.emit()">

      <mat-icon>edit</mat-icon>

      Edit

    </button>


    <button
      mat-raised-button
      type="button"
      class="delete-btn"
      (click)="delete.emit()">

      <mat-icon>delete</mat-icon>

      Delete

    </button>


    <a
      mat-button
      [routerLink]="['/task', task.id]">

      Details

    </a>

  </mat-card-actions>

</mat-card>
