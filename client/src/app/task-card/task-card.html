<mat-card class="task-card">

  <!-- ========================================= -->
  <!-- HEADER -->
  <!-- ========================================= -->

  <mat-card-header>

    <mat-card-title>
      {{ task.title }}
    </mat-card-title>

  </mat-card-header>


  <!-- ========================================= -->
  <!-- STATUS -->
  <!-- ========================================= -->

  <div class="status">

    {{ task.status }}

  </div>


  <!-- ========================================= -->
  <!-- CONTENT -->
  <!-- ========================================= -->

  <mat-card-content>

    <!-- ======================================= -->
    <!-- DESCRIPTION -->
    <!-- ======================================= -->

    @if (task.description) {

      <p class="description">

        {{ task.description }}

      </p>

    }


    <!-- ======================================= -->
    <!-- TASK DETAILS -->
    <!-- ======================================= -->

    <div class="details">


      <!-- PROJECT -->

      <p class="detail-item">

        <strong>
          Project:
        </strong>

        <span>
          {{ task.projectId || 'No Project' }}
        </span>

      </p>


      <!-- PRIORITY -->

      <p class="detail-item">

        <strong>
          Priority:
        </strong>

        <span>
          {{ task.priority }}
        </span>

      </p>


      <!-- DUE DATE -->

      <p class="detail-item">

        <strong>
          Due Date:
        </strong>

        <span>
          {{ task.dueDate | date:'mediumDate' }}
        </span>

      </p>


      <!-- DUE SOON -->

      @if (task.dueDate | dueSoon) {

        <p class="due-soon">

          Due Soon

        </p>

      }

    </div>

  </mat-card-content>


  <!-- ========================================= -->
  <!-- ACTIONS -->
  <!-- ========================================= -->

  <mat-card-actions>


    <!-- ======================================= -->
    <!-- VIEW -->
    <!-- ======================================= -->

    <a
      mat-raised-button
      [routerLink]="['/task', task._id]">

      <mat-icon>
        visibility
      </mat-icon>

      View

    </a>


    <!-- ======================================= -->
    <!-- EDIT -->
    <!-- ======================================= -->

    <button
      mat-raised-button
      class="edit-btn"
      type="button"
      (click)="onEdit()">

      <mat-icon>
        edit
      </mat-icon>

      Edit

    </button>


    <!-- ======================================= -->
    <!-- DELETE -->
    <!-- ======================================= -->

    <button
      mat-raised-button
      class="delete-btn"
      type="button"
      (click)="onDelete()">

      <mat-icon>
        delete
      </mat-icon>

      Delete

    </button>


  </mat-card-actions>

</mat-card>
