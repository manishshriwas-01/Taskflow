<div class="task-form">
  @if(isEditMode){
    <h2>Edit Task </h2>
  }
  @else{
    <h2>Add New Task</h2>
  }
  



  <input type="text" placeholder="Title" [(ngModel)]="newTask.title">

  <textarea placeholder="Description" [(ngModel)]="newTask.description">
    </textarea>

  <div class="row">

    <select [(ngModel)]="newTask.status">
      <option>Todo</option>
      <option>In Progress</option>
      <option>Done</option>
    </select>

    <select [(ngModel)]="newTask.priority">
      <option>Low</option>
      <option>Medium</option>
      <option>High</option>
    </select>

  </div>

  <input type="date" [(ngModel)]="newTask.dueDate">

  @if(isEditMode){
  <button (click)="addTask()">
    Edit
  </button>
  }
  @else{
  <button (click)="addTask()">
    Add Task
  </button>
  }

</div>

<hr>

<div class="task-container">

  @for(task of taskService.tasks(); track task.id){

  <app-task-card [task]="task" (delete)="deleteTask(task.id)" (edit)="editTask(task)">
  </app-task-card>

  }

</div>
